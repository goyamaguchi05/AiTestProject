
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: next-tailwind-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: npm run dev
    tty: true
    stdin_open: true
